          $ref: '#/definitions/model.UserUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ
          schema:
            $ref: '#/definitions/model.UserResponse'
        "400":
          description: Некорректный запрос
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "403":
          description: Требуются права администратора
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "404":
          description: Запись не найдена
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "409":
          description: Конфликт данных или связанных записей
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      security:
      - Bearer: []
      summary: Частично обновить пользователя
      tags:
      - admin/users
  /auth/{provider}:
    get:
      description: Создает одноразовый state, браузерную cookie и PKCE verifier; перенаправляет
        браузер к включенному провайдеру.
      parameters:
      - description: SSO-провайдер
        enum:
        - google
        - yandex
        in: path
        name: provider
        required: true
        type: string
      produces:
      - text/html
      - application/json
      responses:
        "302":
          description: Успешный ответ
          headers:
            Location:
              description: URL авторизации провайдера
              type: string
            Set-Cookie:
              description: HttpOnly cookie привязки OAuth-потока
              type: string
        "404":
          description: Запись не найдена
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "503":
          description: Хранилище SSO временно недоступно
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      summary: Начать вход через SSO
      tags:
      - auth/sso
  /auth/{provider}/callback:
    get:
      description: Проверяет и погашает state, привязанный к браузеру и провайдеру,
        обменивает code с PKCE, устанавливает refresh cookie и возвращает один redirect
        на FRONTEND_URL/auth/callback. Токены не включаются в URL. Frontend затем
        вызывает POST /auth/refresh и GET /users/me с cookies. Совпадение email с
        существующей учетной записью не привязывает SSO автоматически.
      parameters:
      - description: SSO-провайдер
        enum:
        - google
        - yandex
        in: path
        name: provider
        required: true
        type: string
      - description: Authorization code; обязателен при успешной авторизации
        in: query
        name: code
        type: string
      - description: Одноразовый state из начала OAuth-потока
        in: query
        name: state
        required: true
        type: string
      - description: Ошибка или отказ пользователя, возвращенные провайдером
        in: query
        name: error
        type: string
      - description: Cookie привязки потока, установленная в начале SSO
        in: header
        name: Cookie
        required: true
        type: string
      produces:
      - text/html
      - application/json
      responses:
        "302":
          description: Успешный ответ
          headers:
            Location:
              description: FRONTEND_URL/auth/callback
              type: string
            Set-Cookie:
              description: HttpOnly cookie refresh_token; удаление OAuth cookie
              type: string
        "400":
          description: Некорректный запрос
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "404":
          description: Запись не найдена
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "409":
          description: Конфликт данных или связанных записей
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "503":
          description: Хранилище SSO временно недоступно
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      summary: Завершить вход через SSO
      tags:
      - auth/sso
  /auth/login:
    post:
      consumes:
      - application/json
      description: Возвращает access_token и устанавливает HttpOnly cookie refresh_token.
        Пользователь без локального пароля должен входить через своего SSO-провайдера.
      parameters:
      - description: Данные запроса
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/model.UserLogin'
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ
          headers:
            Set-Cookie:
              description: HttpOnly cookie refresh_token
              type: string
          schema:
            $ref: '#/definitions/model.TokenResponse'
        "400":
          description: Некорректный запрос
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      summary: Вход по email и паролю
      tags:
      - auth
  /auth/logout:
    post:
      description: Отзывает refresh token из cookie и удаляет cookie. JSON-тело не
        требуется. Уже выданный access token действует до истечения его TTL.
      parameters:
      - description: refresh_token=<token>; браузер отправляет cookie автоматически
        in: header
        name: Cookie
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ
          headers:
            Set-Cookie:
              description: Удаление cookie refresh_token
              type: string
          schema:
            $ref: '#/definitions/apperrors.SuccessResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      summary: Завершить текущую refresh-сессию
      tags:
      - auth
  /auth/logout/all:
    post:
      description: Отзывает все refresh tokens пользователя из Bearer access token
        и удаляет refresh cookie. JSON-тело не требуется. Уже выданные access tokens
        действуют до истечения TTL.
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ
          headers:
            Set-Cookie:
              description: Удаление cookie refresh_token
              type: string
          schema:
            $ref: '#/definitions/apperrors.SuccessResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      security:
      - Bearer: []
      summary: Завершить все refresh-сессии пользователя
      tags:
      - auth
  /auth/refresh:
    post:
      description: 'Читает refresh_token из cookie; JSON-тело не требуется и не используется.
        Старый refresh token погашается один раз, новый устанавливается через Set-Cookie.
        В JSON возвращается только access_token. Для браузерного запроса отправляйте
        cookies (credentials: include).'
      parameters:
      - description: refresh_token=<token>; браузер отправляет cookie автоматически
        in: header
        name: Cookie
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ
          headers:
            Set-Cookie:
              description: Новая HttpOnly cookie refresh_token
              type: string
          schema:
            $ref: '#/definitions/model.TokenResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      summary: Обновить access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Создает локальную учетную запись и возвращает access_token. Пароль
        обязателен, длина 1–72 байта. Refresh token устанавливается в HttpOnly cookie
        refresh_token.
      parameters:
      - description: Данные запроса
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/model.UserCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Успешный ответ
          headers:
            Set-Cookie:
              description: HttpOnly cookie refresh_token
              type: string
          schema:
            $ref: '#/definitions/model.TokenResponse'
        "400":
          description: Некорректный запрос
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "409":
          description: Конфликт данных или связанных записей
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      summary: Регистрация пользователя
      tags:
      - auth
