basePath: /api/v1
definitions:
  apperrors.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  apperrors.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  model.BusCategory:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  model.BusCreate:
    properties:
      brand:
        type: string
      capacity:
        type: integer
      category_id:
        type: integer
      license_plate:
        type: string
      status_id:
        type: integer
    type: object
  model.BusStatus:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  model.BusUpdate:
    description: BusUpdate changes only supplied fields; omitted fields are preserved
      and ID comes from the URL.
    properties:
      brand:
        type: string
      capacity:
        type: integer
      category_id:
        type: integer
      license_plate:
        type: string
      status_id:
        type: integer
    type: object
  model.DriverInput:
    properties:
      first_name:
        type: string
      last_name:
        type: string
      middle_name:
        type: string
      phone_number:
        type: string
      status:
        type: integer
    type: object
  model.DriverOutput:
    description: DriverOutput contains the driver id and a human-readable status name.
    properties:
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      middle_name:
        type: string
      phone_number:
        type: string
      status:
        type: string
    type: object
  model.DriverStatus:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  model.DriverView:
    properties:
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      middle_name:
        type: string
      phone_number:
        type: string
      status:
        type: string
    type: object
  model.Stop:
    properties:
      address:
        type: string
      created_at:
        type: string
      id:
        type: integer
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      updated_at:
        type: string
    type: object
  model.StopUpdate:
    properties:
      address:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
    type: object
  model.TokenResponse:
    properties:
      access_token:
        type: string
    type: object
  model.Trip:
    description: Trip contains writable trip fields and server-assigned id, created_at
      and updated_at in create responses.
    properties:
      base_price:
        type: number
      bus_id:
        type: integer
      created_at:
        type: string
      driver_id:
        type: integer
      end_time:
        type: string
      id:
        type: integer
      start_time:
        type: string
      status:
        type: string
      updated_at:
        type: string
    required:
    - bus_id
    - driver_id
    - end_time
    - start_time
    type: object
  model.TripResponse:
    description: TripResponse contains separate trip, bus and driver identifiers and
      stops ordered by stop_order. Stops is [] when empty; end_time can be null.
    properties:
      base_price:
        type: number
      bus:
        $ref: '#/definitions/model.ViewBus'
      created_at:
        type: string
      driver:
        $ref: '#/definitions/model.DriverView'
      end_time:
        type: string
      id:
        type: integer
      start_time:
        type: string
      status:
        type: string
      stops:
        description: TripStopDetails is an ordered JSON array of trip-stop relations
          with their stop details.
        items:
          $ref: '#/definitions/model.TripStopDetail'
        type: array
      updated_at:
        type: string
    type: object
  model.TripShortInfo:
    description: TripShortInfo is a compact trip card returned by GET /trips/.
    properties:
      base_price:
        type: number
      brand:
        type: string
      driver_name:
        type: string
      end_stop:
        type: string
      end_time:
        type: string
      license_plate:
        type: string
      start_stop:
        type: string
      start_time:
        type: string
      trip_id:
        type: integer
    type: object
  model.TripStop:
    properties:
      arrival_time:
        type: string
      departure_time:
        type: string
      id:
        type: integer
      price_to_next:
        type: number
      stop_id:
        type: integer
      stop_order:
        type: integer
      trip_id:
        type: integer
    type: object
  model.TripStopDetail:
    description: TripStopDetail contains the trip-stop relation id, trip_id and stop_id,
      schedule, price and the nested stop with its own id.
    properties:
      arrival_time:
        type: string
      departure_time:
        type: string
      id:
        type: integer
      price_to_next:
        type: number
      stop:
        $ref: '#/definitions/model.Stop'
      stop_id:
        type: integer
      stop_order:
        type: integer
      trip_id:
        type: integer
    type: object
  model.TripStopUpdate:
    properties:
      arrival_time:
        type: string
      departure_time:
        type: string
      price_to_next:
        type: number
      stop_id:
        type: integer
      stop_order:
        type: integer
      trip_id:
        type: integer
    type: object
  model.TripUpdate:
    description: TripUpdate changes only supplied trip fields. ID comes from the URL;
      created_at and updated_at are ignored.
    properties:
      base_price:
        type: number
      bus_id:
        type: integer
      created_at:
        type: string
      driver_id:
        type: integer
      end_time:
        type: string
      start_time:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  model.UserCreate:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        description: pointer для nullable
        type: string
    required:
    - email
    - name
    type: object
  model.UserLogin:
    properties:
      email:
        type: string
      ip:
        type: string
      password:
        type: string
      user_agent:
        type: string
    required:
    - email
    - password
    type: object
  model.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      ip:
        type: string
      name:
        type: string
      role:
        type: string
      updated_at:
        type: string
      user_agent:
        type: string
    type: object
  model.UserUpdate:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  model.ViewBus:
    description: ViewBus contains the bus id and human-readable category and status
      names.
    properties:
      brand:
        type: string
      capacity:
        type: integer
      category:
        type: string
      id:
        type: integer
      license_plate:
        type: string
      status:
        type: string
    required:
    - brand
    - capacity
    - id
    - license_plate
    type: object
info:
  contact:
    email: luchitstimofei@yandex.ru
    name: Luchits Timofei
    url: http://example.com
  description: This is a server for order private bus.
