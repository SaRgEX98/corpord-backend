name: corpord-map-pilot
services:
  maps:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    user: "101:101"
    ports: ["127.0.0.1:8092:8080"]
    volumes:
      - ./map-nginx.conf:/etc/nginx/nginx.conf:ro
      - ${MAP_DATA_DIR:?Set prepared pilot maps directory}:/srv/maps:ro
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx:mode=1777", "/var/run"]
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
