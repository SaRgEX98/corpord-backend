pid /tmp/nginx.pid;
worker_processes 1;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  map $http_origin $cors {
    default "";
    "~^http://(localhost|127\.0\.0\.1):(3000|3100|3101|3200)$" $http_origin;
  }
  server {
    listen 8080;
    root /srv/maps;
    server_tokens off;
    etag on;
    gzip off;
    add_header Access-Control-Allow-Origin $cors always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-Match, If-None-Match" always;
    add_header Access-Control-Expose-Headers "ETag, Content-Range, Accept-Ranges, Content-Length" always;
    add_header Vary Origin always;
    add_header Cache-Control "public, max-age=3600" always;
    location = /healthz { return 200 "ok\n"; }
    location ~ ^/(styles/|fonts/|sprites/|licenses/|yekaterinburg\.pmtiles$|map-manifest\.json$) {
      if ($request_method = OPTIONS) { return 204; }
      if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
      try_files $uri =404;
    }
    location / { return 404; }
  }
}
