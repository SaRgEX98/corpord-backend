pid /tmp/nginx.pid;
worker_processes 1;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Replace the exact allowed frontend origin when preparing a deployment.
  map $http_origin $cors_origin {
    default "";
    "http://localhost:3000" "http://localhost:3000";
  }
  server {
    listen 8080;
    server_tokens off;
    root /srv/maps;
    autoindex off;
    gzip off;
    etag on;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-Match, If-None-Match" always;
    add_header Access-Control-Expose-Headers "ETag, Content-Range, Accept-Ranges, Content-Length, Cache-Control" always;
    add_header Vary Origin always;
    add_header Cache-Control "public, max-age=3600" always;
    location = /healthz { access_log off; return 200 "ok\n"; }
    # Retain old versioned archives while clients use cached styles.
    location / {
      if ($request_method = OPTIONS) { return 204; }
      if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
      try_files $uri =404;
    }
  }
}
