# Standalone opt-in template; never changes the existing corpord-infra stack.
name: corpord-geo
services:
  photon:
    build:
      context: .
      dockerfile: Dockerfile.photon
    image: corpord-photon:1.3.0
    ports: ["127.0.0.1:2322:2322"]
    volumes: ["${PHOTON_DATA_DIR:?Set PHOTON_DATA_DIR to a prepared index parent}:/data"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx1024m"
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2322/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
  tiles:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    user: "101:101"
    ports: ["127.0.0.1:8090:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${MAP_DATA_DIR:?Set MAP_DATA_DIR to prepared map assets}:/srv/maps:ro
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx:mode=1777", "/var/run"]
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
